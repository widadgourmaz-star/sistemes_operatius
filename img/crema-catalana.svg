<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="titolCrema">
  <title id="titolCrema">Il·lustració d'una crema catalana en un plat de fang, amb la capa de sucre cremat i una cullera</title>
  <defs>
    <radialGradient id="gradCrema" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f7cf6b"/>
      <stop offset="55%" stop-color="#e3a832"/>
      <stop offset="100%" stop-color="#b9751c"/>
    </radialGradient>
    <linearGradient id="gradPlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97b3f"/>
      <stop offset="100%" stop-color="#a5552a"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="#fdeef6"/>

  <!-- Taula -->
  <rect x="0" y="230" width="480" height="70" fill="#f3d9c4"/>

  <!-- Plat de fang -->
  <ellipse cx="240" cy="190" rx="190" ry="46" fill="#8a4a24"/>
  <ellipse cx="240" cy="180" rx="190" ry="46" fill="url(#gradPlat)"/>
  <ellipse cx="240" cy="178" rx="150" ry="34" fill="#f7e6c4"/>

  <!-- Crema cremada -->
  <ellipse cx="240" cy="176" rx="128" ry="27" fill="url(#gradCrema)"/>

  <!-- Taques de sucre cremat -->
  <g fill="#7a4813" opacity="0.55">
    <ellipse cx="190" cy="168" rx="14" ry="5"/>
    <ellipse cx="260" cy="178" rx="20" ry="6"/>
    <ellipse cx="310" cy="162" rx="10" ry="4"/>
    <ellipse cx="220" cy="190" rx="16" ry="5"/>
  </g>

  <!-- Brillantor -->
  <ellipse cx="200" cy="160" rx="30" ry="8" fill="#fff3d0" opacity="0.5"/>

  <!-- Fulla de menta -->
  <path d="M340 150 C 356 140, 372 146, 374 160 C 360 164, 344 160, 340 150 Z" fill="#4c9a5c"/>
  <line x1="342" y1="152" x2="368" y2="156" stroke="#2f6f3c" stroke-width="1.5"/>

  <!-- Cullera -->
  <ellipse cx="140" cy="172" rx="16" ry="9" fill="#e4e4e4" transform="rotate(-18 140 172)"/>
  <rect x="150" y="176" width="70" height="6" rx="3" fill="#cfcfcf" transform="rotate(-18 150 176)"/>

  <text x="240" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#6b3a1a" text-anchor="middle">Crema catalana</text>
</svg>
